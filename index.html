<head>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#cdeafa;--bg2:#d6f5e3;--card:#fffdf4;--ink:#38384a;--yel:#ffe58f;--ora:#ffb26b;--mint:#b9ebd0;--sky:#b8e0f6;--line:#f0d9a8;--mw:860px;--hill:#a8dfc0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1f3144;--bg2:#1f3a30;--card:#2d3a3a;--ink:#f6f1e0;--line:#5a5a3c;--hill:#2f5a44}}
:root[data-theme="dark"]{--bg1:#1f3144;--bg2:#1f3a30;--card:#2d3a3a;--ink:#f6f1e0;--line:#5a5a3c;--hill:#2f5a44}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Fredoka','Baloo 2','Trebuchet MS',sans-serif;font-weight:600;color:var(--ink);min-height:100vh;font-size:19px;line-height:1.4}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg1)}
button{font:inherit;font-weight:700;color:#38384a;border:3px solid #38384a;background:var(--yel);border-radius:999px;padding:9px 18px;cursor:pointer;box-shadow:0 4px 0 #38384a;transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #38384a}
button:focus-visible{outline:4px solid #4a8cff;outline-offset:2px}
button.o{background:var(--ora)}button.m{background:var(--mint)}button.s{background:var(--sky)}
button:disabled{opacity:.45;cursor:not-allowed}
#pts{margin-left:auto;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:6px 16px}
main{max-width:var(--mw);margin:0 auto;padding:6px 16px 40px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:28px;padding:22px;margin-bottom:16px;box-shadow:0 6px 0 rgba(56,56,74,.25)}
h1{font-size:clamp(34px,7vw,56px);line-height:1.05;margin:.2em 0}h2{font-size:clamp(26px,5vw,36px);margin:.2em 0 .4em}
.hero{text-align:center}.big{font-size:64px;line-height:1}
.cast{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:14px 0}
.cast div{text-align:center;font-size:15px}.cast span{display:block;font-size:64px}
.say{display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.say .av{font-size:50px;line-height:1}
.say .b{background:var(--mint);color:#38384a;border:3px solid #38384a;border-radius:20px;padding:10px 16px;flex:1}
.say.f .b{background:var(--ora)}.say.r .b{background:var(--sky)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row.c{justify-content:center}
.map{position:relative;display:grid;gap:14px}
.node{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border-radius:26px;padding:14px 18px;background:var(--mint)}
.node.lk{background:#d9d9d9;opacity:.7}.node .ic{font-size:44px}.node small{display:block;font-weight:400;font-size:15px}
.bar{display:flex;gap:4px;margin:8px 0;align-items:center}
.bar i{flex:1;height:34px;border:3px solid #38384a;border-radius:10px;background:#fff;max-width:90px}
.bar i.on{background:var(--ora)}.bar b{min-width:64px;font-size:22px}
.bar.click i{cursor:pointer}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button.on{background:var(--ora)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:14px}
.opts button{font-size:26px;padding:14px}
.opts button.no{background:#ffc9c9;animation:sh .3s}.opts button.ok{background:#a8f0b8}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.prog{height:14px;border:3px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}.prog div{height:100%;background:var(--ora);transition:width .3s}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-size:40px;line-height:1;margin:0 8px;vertical-align:middle}.fr u{display:block;width:100%;border-top:4px solid currentColor;margin:3px 0}
.stars{font-size:44px}
.deco{position:fixed;font-size:34px;pointer-events:none;opacity:.8;z-index:0}
.deco.a{left:2%;bottom:6%}.deco.b{right:3%;bottom:9%}
@media (prefers-reduced-motion:no-preference){.deco.b{animation:fl 4s ease-in-out infinite}}
@keyframes fl{50%{transform:translateY(-14px)}}
main{position:relative;z-index:1}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden}#bg svg{display:block}#bg::after{content:"";position:absolute;inset:0;background:rgba(10,20,50,.5);opacity:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #bg::after{opacity:1}}:root[data-theme="dark"] #bg::after{opacity:1}
.ff{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff3a0;box-shadow:0 0 12px 5px #ffe97a;opacity:.7}
@media (prefers-reduced-motion:no-preference){.ff{animation:ffl 6s ease-in-out infinite}.cl{animation:cld 40s linear infinite alternate}.cl.c2{animation-duration:55s}}
@keyframes ffl{50%{transform:translate(24px,-30px);opacity:.2}}@keyframes cld{to{transform:translateX(160px)}}
#stp{max-width:var(--mw);margin:0 auto;padding:0 16px 8px;display:flex;gap:6px;flex-wrap:wrap;position:relative;z-index:1}
.sb{font-size:14px;padding:5px 12px;box-shadow:0 3px 0 #38384a}
.c3{width:150px;height:150px;touch-action:none;cursor:grab}.av img{width:78px;height:78px;display:block}.stp2{font-size:15px;margin:10px 0 0}
.chr{display:block;margin:0 auto;overflow:visible;filter:drop-shadow(0 4px 0 rgba(56,56,74,.18))}.chrw{cursor:pointer;text-align:center;font-size:15px}.bd,.ey{transform-box:fill-box}
.bd{transform-origin:50% 100%}.ey{transform-origin:center}
@media (prefers-reduced-motion:no-preference){.bd{animation:bob 2.6s ease-in-out infinite}.ey{animation:bl 4.5s infinite}.chrw.jp .bd{animation:jmp .6s}}
@keyframes bob{50%{transform:translateY(-6px) scale(1.02,.98)}}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}@keyframes jmp{40%{transform:translateY(-34px) rotate(-6deg)}70%{transform:translateY(0) scale(1.06,.92)}}
.by{display:inline-block;background:var(--yel);color:#38384a;border:3px solid #38384a;border-radius:999px;padding:6px 18px;margin:0 0 6px}
.fd{max-width:100%;height:auto}.fd [data-i]{cursor:pointer}.mt{font-size:30px}.mr{min-height:1.4em;margin:4px 0}
.row button.ok{background:#a8f0b8}.row button.no{background:#ffc9c9}
.cmx{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:10px}
.pnl{border:3px solid #38384a;border-radius:20px;padding:14px 12px 12px;color:#38384a;position:relative}
.pnl .nm{position:absolute;top:-14px;left:-6px;background:#ffb26b;border:3px solid #38384a;border-radius:99px;width:34px;height:34px;display:grid;place-items:center}
.pnl .vis{display:flex;align-items:flex-end;justify-content:center;gap:6px}
.bal{background:#fff;border:3px solid #38384a;border-radius:18px;padding:8px 12px;margin:8px 0}
.vd{aspect-ratio:16/9;width:100%;border:3px solid var(--ink);border-radius:20px;background:#000}
a.lnk{display:inline-block;background:var(--ora);color:#38384a;border:3px solid #38384a;border-radius:999px;padding:9px 18px;font-weight:700;text-decoration:none;box-shadow:0 4px 0 #38384a}
label{display:block;margin:12px 0 4px}input[type=text],input[type=number],textarea{font:inherit;font-weight:600;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;width:100%;background:#fff;color:#38384a}
.tw{overflow-x:auto}.tb{width:100%;border-collapse:collapse;font-size:15px}.tb td,.tb th{border:2px solid var(--ink);padding:4px 8px;text-align:left}.tb th{background:var(--yel);color:#38384a}
#top{max-width:var(--mw);margin:0 auto;background:color-mix(in srgb,var(--bg1) 78%,transparent);backdrop-filter:blur(6px);border-radius:0 0 18px 18px}
body.pc{--mw:1120px;font-size:20px}
body.pc .map{grid-template-columns:1fr 1fr}body.pc .opts{grid-template-columns:repeat(4,1fr)}body.pc .cmx{grid-template-columns:repeat(4,1fr)}
body.pc .card{padding:28px}body.pc .cast svg{width:190px;height:auto}
body.hp{font-size:16px}body.hp.force{--mw:440px}
body.hp main{padding:4px 10px 60px}body.hp .card{padding:14px;border-radius:22px}
body.hp button{padding:7px 13px;font-size:15px;box-shadow:0 3px 0 #38384a}
body.hp #top,body.hp #stp,body.hp .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
body.hp #top button,body.hp #stp button,body.hp .tabs button,body.hp #pts{flex:0 0 auto;white-space:nowrap}
body.hp .cmx{grid-template-columns:1fr}body.hp .opts{grid-template-columns:1fr 1fr}body.hp .opts button{font-size:22px;padding:12px 6px}
body.hp .fr{font-size:30px}body.hp h1{font-size:30px}body.hp h2{font-size:24px}body.hp .cast svg{width:96px;height:auto}
body.hp .node{padding:10px 12px}body.hp .node .ic{font-size:34px}body.hp .bar i{height:26px}body.hp .say .av{transform:scale(.85);transform-origin:top left}
body.hp .mt{font-size:24px}body.hp .row.c svg.fd{max-width:46%}
body.short #top{padding:4px 10px}body.short .card{padding:12px}body.short .chr{max-height:110px}
</style>
</head>
<body>
<div id="bg"></div>
<div id="top">
<button class="s" onclick="go('cover')">🏠 Menu</button>
<button class="s" onclick="back()">◀ Kembali</button>
<button class="m" onclick="go('map')">🗺️ Peta</button>
<button class="o" id="mb" onclick="tm()">🔇 Musik</button><button class="s" id="vb" onclick="vw()">📱💻 Auto</button><span id="pts">⭐ 0</span>
</div>
<div id="stp"></div>
<main id="v"></main>
<script>
var Q=[
{t:"Bubu memotong apel menjadi 4 bagian sama besar. Bubu makan 3 bagian. Berapa pecahan apel yang dimakan Bubu?",v:[[3,4]],o:["3/4","1/4","4/3","3/3"],a:0,h:"Penyebut = jumlah semua bagian. Pembilang = bagian yang diambil.",e:"Dari 4 bagian, 3 diambil, jadi 3/4."},
{t:"Rubi punya pizza. Ia bilang 1/2 sama nilainya dengan ?/4. Berapa angka yang cocok?",v:[[1,2],[2,4]],o:["1/4","2/4","3/4","4/4"],a:1,h:"Lihat dua gambar. Bagian berwarnanya sama panjang.",e:"1/2 = 2/4. Itu pecahan senilai."},
{t:"Kuku punya 3/8 kg madu. Bubu punya 5/8 kg madu. Siapa yang punya madu lebih banyak?",v:[[3,8],[5,8]],o:["Kuku","Bubu","Sama banyak","Tidak tahu"],a:1,h:"Penyebutnya sama. Bandingkan pembilangnya.",e:"5/8 lebih besar dari 3/8, jadi Bubu lebih banyak."},
{t:"Rubi punya 2/6 bagian kue. Kuku memberi 3/6 bagian lagi. Berapa jumlah kue Rubi sekarang?",v:[[2,6],[3,6]],o:["5/12","5/6","6/6","1/6"],a:1,h:"Penyebut tetap 6. Jumlahkan pembilangnya: 2 + 3.",e:"2/6 + 3/6 = 5/6."},
{t:"1/5 + 2/5 = ?",v:[[1,5],[2,5]],o:["3/10","2/5","3/5","3/25"],a:2,h:"Penyebut tidak dijumlah. Hanya pembilang.",e:"1/5 + 2/5 = 3/5."},
{t:"7/8 − 3/8 = ?",v:[[7,8],[3,8]],o:["4/8","10/8","4/0","3/8"],a:0,h:"Penyebut tetap 8. Kurangkan pembilangnya: 7 − 3.",e:"7/8 − 3/8 = 4/8."},
{t:"Bubu mengumpulkan 2/5 kg madu di pagi hari dan 2/5 kg di siang hari. Berapa kg madu Bubu seluruhnya?",v:[[2,5],[2,5]],o:["2/5","4/10","4/5","1/5"],a:2,h:"Kata “seluruhnya” berarti dijumlahkan.",e:"2/5 + 2/5 = 4/5 kg."},
{t:"Kuku punya pita 5/6 meter. Kuku memakai 2/6 meter untuk hiasan pohon. Berapa meter sisa pita Kuku?",v:[[5,6],[2,6]],o:["7/6","3/6","3/0","2/6"],a:1,h:"Kata “sisa” berarti dikurangi.",e:"5/6 − 2/6 = 3/6 meter."},
{t:"Sebuah kue buah dibagi 8 bagian sama besar. Rubi makan 3 bagian dan Bubu makan 4 bagian. Berapa pecahan kue yang dimakan keduanya?",v:[[3,8],[4,8]],o:["7/8","7/16","1/8","12/8"],a:0,h:"Jumlahkan bagian Rubi dan Bubu: 3 + 4.",e:"3/8 + 4/8 = 7/8."},
{t:"Sebuah semangka dibagi 6 bagian sama besar. Bubu makan 2/6 dan Rubi makan 3/6. Berapa sisa semangka?",v:[[2,6],[3,6]],o:["5/6","6/6","1/6","0"],a:2,h:"Dimakan 2/6 + 3/6 = 5/6. Satu utuh sama dengan 6/6.",e:"6/6 − 5/6 = 1/6."},
{t:"Bubu punya 2 roti utuh dan 1/4 roti lagi. Bagaimana menulis jumlah roti Bubu sebagai pecahan campuran?",v:[],f:[[4,4,"kue"],[4,4,"kue"],[1,4,"kue"]],o:["2 1/4","1/4","2/4","4/2"],a:0,h:"Pecahan campuran = bilangan bulat + pecahan. Hitung dulu berapa kue yang utuh.",e:"2 utuh dan 1/4 ditulis 2 1/4."},
{t:"Rubi punya 7/4 pizza. Jika diubah menjadi pecahan campuran, hasilnya ...",v:[],f:[[4,4,"pizza"],[3,4,"pizza"]],o:["1 3/4","3 1/4","1 1/4","7 4"],a:0,h:"Satu pizza utuh ada 4 potong. 7 potong = 4 potong + 3 potong.",e:"7/4 = 1 3/4."},
{t:"Kuku membagi cokelat menjadi 10 bagian sama besar dan makan 3 bagian. Dalam desimal, bagian yang dimakan adalah ...",v:[],f:[[3,10,"cokelat"]],o:["0,3","3,0","0,03","0,13"],a:0,h:"Satu angka di belakang koma artinya persepuluh.",e:"3/10 = 0,3."},
{t:"Pecahan desimal 0,75 sama dengan pecahan ...",v:[],f:[[3,4,"pizza"]],o:["3/4","7/5","1/4","3/5"],a:0,h:"0,75 sama dengan 75 per 100. Bagi 75 dan 100 dengan 25.",e:"0,75 = 75/100 = 3/4."},
{t:"Pizza dipotong 4 sama besar. Rubi makan 1 potong. Berapa persen pizza yang dimakan Rubi?",v:[],f:[[1,4,"pizza"]],o:["10%","25%","40%","50%"],a:1,h:"1/4 sama dengan 25/100.",e:"1/4 = 25/100 = 25%."},
{t:"Bubu makan 50% kue. Pecahan yang sama dengan 50% adalah ...",v:[],f:[[2,4,"kue"]],o:["1/2","1/4","2/5","5/1"],a:0,h:"50% = 50/100. Sederhanakan dengan membagi 50.",e:"50% = 50/100 = 1/2."}
];
var L=[{n:"Hutan Pohon Ceria",ic:"🌳",d:"Mengenal pecahan, senilai, dan membandingkan",q:[0,1,2]},{n:"Sungai Kilau",ic:"🏞️",d:"Menjumlah dan mengurang pecahan",q:[3,4,5]},{n:"Bukit Madu",ic:"🍯",d:"Soal cerita pecahan",q:[6,7,8,9]},{n:"Gunung Desimal",ic:"⛰️",d:"Pecahan campuran, desimal, dan persen",q:[10,11,12,13,14,15]}];
var S={scr:'cover',hist:[],lv:0,qi:0,pts:[],un:1,stars:[0,0,0,0],seen:false,tab:0,lab:{n:4,on:[],a:2,b:1,op:'+'},ref:{},ans:{}};
var v=document.getElementById('v');
function say(w,t){var m={Rubi:['🦊','f'],Bubu:['🐻',''],Kuku:['🦉','r']}[w];return '<div class="say '+m[1]+'"><div class="av">'+ch(w,0,78)+'</div><div class="b"><small>'+w+'</small><br>'+t+'</div></div>'}
function fr(a,b){return '<span class="fr">'+a+'<u></u>'+b+'</span>'}
function bar(k,n,l){var s='<div class="bar">';for(var i=0;i<n;i++)s+='<i class="'+(i<k?'on':'')+'"></i>';return s+(l===false?'':'<b>'+k+'/'+n+'</b>')+'</div>'}
function total(){return S.pts.reduce(function(a,b){return a+(b||0)},0)}
function go(s,noh){if((s=='map'||s=='game')&&!S.user)s='login';if(!noh&&S.scr!==s)S.hist.push(S.scr);S.scr=s;draw();window.scrollTo(0,0)}
function back(){var p=S.hist.pop();if(p){S.scr=p;draw()}}
function draw(){document.getElementById('pts').textContent='⭐ '+total();steps();var f=window['r_'+S.scr];v.innerHTML=f();if(window['a_'+S.scr])window['a_'+S.scr]()}
function r_cover(){return '<div class="card hero"><div class="big">🌲🌳🌲</div><h1>Petualangan Pecahan di Hutan Ceria</h1><p class="by">Dibuat oleh: Yulia Permata Sari</p><p>Bantu Rubi, Bubu, dan Kuku menyelesaikan 10 tantangan pecahan. Siap jadi jagoan pecahan?</p><div class="cast"><div class="chrw" data-c="Rubi" onclick="hi(this)">'+ch("Rubi")+'<br>Rubi si rubah</div><div class="chrw" data-c="Bubu" onclick="hi(this)">'+ch("Bubu")+'<br>Bubu si beruang</div><div class="chrw" data-c="Kuku" onclick="hi(this)">'+ch("Kuku")+'<br>Kuku si burung hantu</div></div><div id="cs"><small>Ketuk karakter untuk menyapa!</small></div><div class="row c"><button class="o" style="font-size:26px" onclick="begin()">▶ Mulai Petualangan</button><button class="m" onclick="go(\'tujuan\')">🎯 Tujuan Belajar</button><button onclick="go(\'materi\')">📖 Belajar Dulu</button><button class="s" id="gb" style="display:none" onclick="go(\'guru\')">👩‍🏫 Halaman Guru</button></div></div>'}
function r_map(){var h='<div class="card"><h2>🗺️ Peta Hutan Ceria</h2><p>'+usr()+'</p>'+say('Kuku','Ada 3 tempat seru di hutan. Selesaikan satu tempat untuk membuka tempat berikutnya!')+'<div class="map">';
L.forEach(function(l,i){var lk=i>=S.un;h+='<button class="node '+(lk?'lk':'')+'" '+(lk?'disabled':'')+' onclick="start('+i+')"><span class="ic">'+(lk?'🔒':l.ic)+'</span><span>Level '+(i+1)+': '+l.n+'<small>'+l.d+' · '+l.q.length+' soal</small></span><span style="margin-left:auto" class="stars">'+('⭐'.repeat(S.stars[i]))+'</span></button>'});
h+='</div><div class="row c"><button class="s" onclick="go(\'tujuan\')">🎯 Tujuan Belajar</button><button class="m" onclick="go(\'materi\')">📖 Materi</button>'+(S.un>4?'<button class="o" onclick="go(\'refleksi\')">💭 Refleksi ▶</button>':'')+'</div></div>';return h}
function start(i){if(!S.user){go('login');return}S.lv=i;S.qi=0;S.ans={};S.done=0;S.hint=0;if(!S.seen){S.seen=true;S.next=i;go('tujuan');return}go('game')}
function r_tujuan(){return '<div class="card"><h2>🎯 Tujuan Belajar</h2>'+say('Kuku','Setelah bermain, kamu akan bisa:')+'<div class="say"><div class="b" style="background:var(--yel)">✅ Menyebut dan menulis pecahan dari gambar<br>✅ Mengenal pecahan senilai dan membandingkan pecahan<br>✅ Mengenal pecahan biasa, campuran, desimal, dan persen<br>✅ Menjumlah dan mengurang pecahan berpenyebut sama<br>✅ Menyelesaikan soal cerita pecahan</div></div><div class="row"><button onclick="back()">◀ Kembali</button><button class="o" onclick="go(\'materi\')">Lanjut ke Materi ▶</button></div></div>'}
var FD={pizza:['#ffc94a','#fff4d6','#e09a3e'],kue:['#ff9ec4','#fff0f5','#d46a9a'],cokelat:['#7b4a2a','#ead7bc','#4a2a14']};
function sel(k,i){return Array.isArray(k)?k.indexOf(i)>-1:i<k}
function pol(a,r){return (100+r*Math.sin(a)).toFixed(1)+','+(100-r*Math.cos(a)).toFixed(1)}
function food(k,n,f,sz){var c=FD[f],h='<svg class="fd" viewBox="0 0 200 200" width="'+sz+'" height="'+sz+'" role="img" aria-label="'+f+'">';
if(f=='cokelat'){var w=180/n;for(var i=0;i<n;i++){var s=sel(k,i);h+='<rect data-i="'+i+'" x="'+(10+i*w)+'" y="55" width="'+w+'" height="90" rx="6" fill="'+(s?c[0]:c[1])+'" stroke="'+c[2]+'" stroke-width="4"/>'+(s?'<rect x="'+(14+i*w)+'" y="62" width="'+(w-8)+'" height="12" rx="4" fill="#fff" opacity=".25" pointer-events="none"/>':'')}}
